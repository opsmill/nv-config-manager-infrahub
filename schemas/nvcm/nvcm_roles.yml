---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

# Device roles as a node instead of a Dropdown. NVCM ships 88 roles and uses
# them for template selection, DHCP option scoping, firmware targets and
# location topology (WAN routers). Remove the Dropdown `role` attribute from
# the schema-library DcimDevice copy when loading this file.

nodes:
  - name: DeviceRole
    namespace: Nvcm
    description: Functional role of a device, selects templates and intent
    label: Device Role
    icon: mdi:tag-outline
    include_in_menu: true
    menu_placement: DcimGenericDevice
    human_friendly_id:
      - name__value
    display_label: name__value
    uniqueness_constraints:
      - [name__value]
    order_by:
      - name__value
    attributes:
      - name: name
        kind: Text
        description: Role name as used in template paths, for example tan-leaf
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: category
        kind: Dropdown
        description: Coarse grouping used by workflows and location topology
        default_value: network
        order_weight: 1200
        choices:
          - name: network
            description: Switch or router NVCM renders configuration for
            color: "#7fbfff"
          - name: wan_router
            description: Site WAN or border router listed in location topology
            color: "#bf7fff"
          - name: compute
            description: GPU or CPU server tracked for topology only
            color: "#ffbf7f"
          - name: storage
            description: Storage node tracked for topology only
            color: "#ffff7f"
          - name: management
            description: Management server, UFM, jump host or console server
            color: "#bfbfbf"
      - name: managed_by_nvcm
        label: Managed by NVCM
        description: NVCM renders and deploys configuration for this role
        kind: Boolean
        default_value: false
        order_weight: 1300
    relationships:
      - name: devices
        peer: DcimGenericDevice
        kind: Generic
        cardinality: many
        identifier: device__nvcm_role
        order_weight: 2000

extensions:
  nodes:
    - kind: DcimGenericDevice
      relationships:
        - name: device_role
          label: Role
          peer: NvcmDeviceRole
          kind: Attribute
          cardinality: one
          optional: false
          identifier: device__nvcm_role
          order_weight: 1150
