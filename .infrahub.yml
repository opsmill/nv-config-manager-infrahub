---
# yaml-language-server: $schema=https://schema.infrahub.app/python-sdk/repository-config/latest.json
#
# Infrahub repository for NVIDIA Config Manager (NVCM).
#
# Load order matters for the schema: base, then schema-library extensions,
# then the Nvcm namespace that extends them.

schemas:
  - schemas/base/organization.yml
  - schemas/base/location.yml
  - schemas/base/dcim.yml
  - schemas/base/ipam.yml
  - schemas/extensions/tenancy.yml
  - schemas/extensions/vlan.yml
  - schemas/extensions/vrf.yml
  - schemas/extensions/cable.yml
  - schemas/extensions/lag.yml
  - schemas/extensions/routing.yml
  - schemas/extensions/bgp.yml
  - schemas/nvcm/nvcm_locations.yml
  - schemas/nvcm/nvcm_roles.yml
  - schemas/nvcm/nvcm_device_state.yml
  - schemas/nvcm/nvcm_services.yml
  - schemas/nvcm/nvcm_firmware.yml
  - schemas/nvcm/nvcm_routing_intent.yml
  - schemas/nvcm/nvcm_dhcp.yml
  - schemas/nvcm/nvcm_location_intent.yml
  - schemas/nvcm/nvcm_overlays.yml

